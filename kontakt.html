<body>

<header class="site-header" id="top">
  <a class="brand" href="index.html">KMF <span>2027</span></a>
  <button class="nav-toggle" aria-label="Menü" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>

<main>
  <div class="page-head"><div class="wrap"><h1>Kontakt</h1><p>Fragen oder Anregungen? Schreiben Sie uns gerne eine Nachricht.</p></div></div>

  <section class="section">
    <div class="wrap two-col top">
      <form id="contactForm" class="form" action="kontakt.php" method="post">
        <label>Name
          <input type="text" name="name" required maxlength="100" autocomplete="name">
        </label>
        <label>E-Mail
          <input type="email" name="email" required maxlength="150" autocomplete="email">
        </label>
        <label>Nachricht
          <textarea name="message" rows="6" required maxlength="3000"></textarea>
        </label>
        <!-- Honeypot gegen Spam: muss leer bleiben -->
        <div class="hp" aria-hidden="true"><label>Webseite<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="check">
          <input type="checkbox" name="privacy" required>
          <span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen und bin damit einverstanden, dass meine Angaben zur Bearbeitung der Anfrage verwendet werden.</span>
        </label>
        <button class="btn" type="submit">Nachricht senden</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
      <div>
        <h3>Musikverein Zimmern u.d.B.</h3>
        <p>Im Gieß 2<br>72369 Zimmern unter der Burg</p>
        <p><a href="mailto:info@mv-zimmern.de">info@mv-zimmern.de</a><br><a href="https://www.mv-zimmern.de/" target="_blank" rel="noopener">www.mv-zimmern.de</a></p>
      </div>
    </div>
  </section>
</main>

<footer>

  </div>
</footer>

</html>
